# Kairos TV — configuración definitiva (con https).
# Va en /opt/nginx/conf/conf.d/kairostv.conf, DESPUÉS de sacar el certificado
# con kairostv-paso1.conf (ver despliegue/README.md).

server {
    listen 80;
    server_name kairostv.grupokairosarg.com;

    # Se deja para que certbot pueda renovar el certificado solo
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kairostv.grupokairosarg.com;

    ssl_certificate /etc/letsencrypt/live/kairostv.grupokairosarg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairostv.grupokairosarg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Las listas M3U que se suben desde el panel pueden pesar decenas de MB
    # (el panel acepta hasta 150: canales/forms.py, TAMANIO_MAXIMO). Sin esto
    # nginx corta en 1 MB con "413 Request Entity Too Large" y la importación
    # falla antes de llegar a Django.
    client_max_body_size 160m;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /proyectos-ks/kairosTV/kairos-tv/staticfiles/;
    }

    # Fotos de perfil, logos y las APK que se descargan desde /descargar/
    location /media/ {
        alias /proyectos-ks/kairosTV/kairos-tv/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Igual que el --timeout de gunicorn. Verificar canales se hace de a
        # tandas de menos de 1 minuto, pero queda margen por si una tarda.
        proxy_read_timeout 300s;
    }
}
