{% load static %}<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0E0E12">
    <meta name="color-scheme" content="dark">
    <title>{% block titulo %}{% endblock %} · Kairos TV</title>
    <link rel="icon" type="image/png" href="{% static 'img/kairos-tv-symbol-v2.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/kairos.css' %}" rel="stylesheet">
    {% block estilos %}{% endblock %}
</head>
<body class="{% block clase_body %}{% endblock %}">
    <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>
    {% block cuerpo %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/sistema.js' %}"></script>
    <script src="{% static 'js/tablas_anchas.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
