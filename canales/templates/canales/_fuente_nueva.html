{% comment %}
    Una fila de «Agregar fuentes» en el panel de edición de Organizar (NuevaFuenteForm): número (vacío = al final),
    dirección y, solo si es una página web con reproductor, la casilla. Es el molde (<template>, con __prefix__)
    que copia organizar_trabajo.js con «Agregar una fuente».
{% endcomment %}
<div class="fuente-nueva">
    {{ f.numero }}
    {{ f.url }}
    <button type="button" class="btn-icono btn-icono-peligro" data-quitar-fila aria-label="Quitar esta fila" title="Quitar esta fila"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    <div class="form-check fuente-nueva-web">
        {{ f.reproductor_web }}
        <label class="form-check-label" for="{{ f.reproductor_web.id_for_label }}">Solo si es una página web con reproductor</label>
    </div>
</div>
